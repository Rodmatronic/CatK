echo "GRUB :3"

insmod all_video

color_normal=cyan/black
menu_color_highlight=white/cyan
menu_color_normal=cyan/black
timeout=5

menuentry "Start CatKernel :3" {
    echo -n "Cat..."
    multiboot2 /boot/catkernel.elf
}

menuentry "Start CatKernel (DEBUG)" {
    echo -n "Cat..."
    multiboot2 /boot/catkernel.elf debugboot
}

menuentry "Shutdown" {
	halt
}

menuentry "Reboot" {
	reboot
}

menuentry "UEFI Firmware Setup" {
    fwsetup
}
